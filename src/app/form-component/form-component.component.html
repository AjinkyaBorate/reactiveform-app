<div class="mt-3">
  <form action="" (ngSubmit)="onSubmit()">
    <div>
      <input type="text" placeholder="Enter firstname" [(ngModel)]="fname" />
    </div>
    <div >
      <button class="btn btn-primary mt-3 mb-3">click me</button>
    </div>
  </form>
</div>
<div>
  <div>
    <input type="text" placeholder="Enter lastname" [(ngModel)]="lname" />
    <div>
      <p>firstname: {{ fname }}</p>
      <p>lastname:{{ lname }}</p>
    </div>
  </div>
</div>
